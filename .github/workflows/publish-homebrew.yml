name: Publish to Homebrew

on:
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'
      - name: Build osx-arm64
        run: |
          dotnet publish src/WiFiQRCodeGenerator/WiFiQRCodeGenerator.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -o ./publish/osx-arm64
      - name: Build osx-x64
        run: |
          dotnet publish src/WiFiQRCodeGenerator/WiFiQRCodeGenerator.csproj \
            -c Release -r osx-x64 --self-contained true \
            -o ./publish/osx-x64
      - name: Rename binaries
        run: |
          mv ./publish/osx-arm64/WiFiQRCodeGenerator ./publish/osx-arm64/wqr
          mv ./publish/osx-x64/WiFiQRCodeGenerator ./publish/osx-x64/wqr
      - name: Create tarballs
        run: |
          tar -czf wqr-osx-arm64.tar.gz -C ./publish/osx-arm64 wqr
          tar -czf wqr-osx-x64.tar.gz -C ./publish/osx-x64 wqr
      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-builds
          path: |
            wqr-osx-arm64.tar.gz
            wqr-osx-x64.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'
      - name: Build linux-x64
        run: |
          dotnet publish src/WiFiQRCodeGenerator/WiFiQRCodeGenerator.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o ./publish/linux-x64
      - name: Rename binary
        run: mv ./publish/linux-x64/WiFiQRCodeGenerator ./publish/linux-x64/wqr
      - name: Create tarball
        run: tar -czf wqr-linux-x64.tar.gz -C ./publish/linux-x64 wqr
      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-builds
          path: wqr-linux-x64.tar.gz

  publish:
    needs: [build-macos, build-linux]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
      - name: Download all builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            wqr-osx-arm64.tar.gz
            wqr-osx-x64.tar.gz
            wqr-linux-x64.tar.gz
      - name: Update Homebrew formula
        run: |
          SHA_ARM64=$(shasum -a 256 wqr-osx-arm64.tar.gz | awk '{print $1}')
          SHA_X64=$(shasum -a 256 wqr-osx-x64.tar.gz | awk '{print $1}')
          SHA_LINUX=$(shasum -a 256 wqr-linux-x64.tar.gz | awk '{print $1}')
          VERSION=${GITHUB_REF_NAME#v}
          
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Formula/wqr.rb
          sed -i '' "s|releases/download/.*/wqr-osx-arm64|releases/download/v${VERSION}/wqr-osx-arm64|" Formula/wqr.rb
          sed -i '' "s|releases/download/.*/wqr-osx-x64|releases/download/v${VERSION}/wqr-osx-x64|" Formula/wqr.rb
          sed -i '' "s|releases/download/.*/wqr-linux-x64|releases/download/v${VERSION}/wqr-linux-x64|" Formula/wqr.rb
          sed -i '' "s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_ARM64}\"/" Formula/wqr.rb
          sed -i '' "s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_X64}\"/" Formula/wqr.rb
          sed -i '' "s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_LINUX}\"/" Formula/wqr.rb
          
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/wqr.rb
          git diff --staged --quiet || git commit -m "Update wqr formula to ${VERSION}"
          git push